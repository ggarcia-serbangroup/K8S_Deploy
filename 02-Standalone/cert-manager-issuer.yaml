apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: illuminati-ca-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: illuminati-ca-secret
  namespace: cert-manager
spec:
  isCA: true
  commonName: "illuminati.dark CA"
  secretName: root-secret-ca
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: illuminati-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: root-secret-ca
