---
# -------------------------------------------------------------------
# 1. ELASTICSEARCH (StatefulSet + Service)
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch-dev
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    storage: nutanix
    proyect: observability
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      app.kubernetes.io/instance: elasticsearch-dev
      environment: developer
      storage: nutanix
      proyect: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/instance: elasticsearch-dev
        app.kubernetes.io/component: search-engine
        app.kubernetes.io/part-of: elastic-stack
        environment: developer
        storage: nutanix
        proyect: observability
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
        env:
        - name: discovery.type
          value: single-node
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: xpack.security.enabled
          value: "true"
        - name: xpack.security.http.ssl.enabled
          value: "true"
        - name: xpack.security.http.ssl.key
          value: "/usr/share/elasticsearch/config/certs/tls.key"
        - name: xpack.security.http.ssl.certificate
          value: "/usr/share/elasticsearch/config/certs/tls.crt"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_PASSWORD
        ports:
        - containerPort: 9200
          name: https
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "500m"
            memory: 1Gi
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        - name: tls-certs
          mountPath: /usr/share/elasticsearch/config/certs
          readOnly: true
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-data
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: storage
        environment: developer
        storage: nutanix
        proyect: observability
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "nutanix-cluster-g5-volume"
      resources:
        requests:
          storage: 300Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch-dev
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    proyect: observability
spec:
  type: ClusterIP
  ports:
  - port: 9200
    targetPort: 9200
    name: https
  selector:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch-dev

---
# -------------------------------------------------------------------
# 2. KIBANA (Deployment + Service)
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-dev
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    proyect: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
      app.kubernetes.io/instance: kibana-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/instance: kibana-dev
        app.kubernetes.io/component: visualization
        app.kubernetes.io/part-of: elastic-stack
        environment: developer
        proyect: observability
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:9.4.4
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "https://elasticsearch:9200"
        - name: ELASTICSEARCH_USERNAME
          value: "elastic"
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_PASSWORD
        - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
          value: "/usr/share/kibana/config/certs/ca.crt"
        - name: SERVER_NAME
          value: "kibana-dev.illuminati.dark"
        - name: SERVER_SSL_ENABLED
          value: "true"
        - name: SERVER_SSL_CERTIFICATE
          value: "/usr/share/kibana/config/certs/tls.crt"
        - name: SERVER_SSL_KEY
          value: "/usr/share/kibana/config/certs/tls.key"
        ports:
        - containerPort: 5601
          name: https
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "250m"
            memory: 512Mi
        volumeMounts:
        - name: tls-certs
          mountPath: /usr/share/kibana/config/certs
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: wildcard-illuminati-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-dev
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    proyect: observability
spec:
  type: ClusterIP
  ports:
  - port: 5601
    targetPort: 5601
    name: http
  selector:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-dev

---
# -------------------------------------------------------------------
# 3. FLEET-SERVER (Deployment + Service)
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-server
  namespace: default
  labels:
    app.kubernetes.io/name: fleet-server
    app.kubernetes.io/instance: fleet-dev
    app.kubernetes.io/component: management
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    proyect: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-server
      app.kubernetes.io/instance: fleet-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-server
        app.kubernetes.io/instance: fleet-dev
        app.kubernetes.io/component: management
        app.kubernetes.io/part-of: elastic-stack
        environment: developer
        proyect: observability
    spec:
      containers:
      - name: fleet-server
        image: docker.elastic.co/beats/elastic-agent:9.4.4
        env:
        - name: FLEET_SERVER_ENABLE
          value: "true"
        - name: FLEET_SERVER_ELASTICSEARCH_HOST
          value: "https://elasticsearch:9200"
        - name: FLEET_SERVER_ELASTICSEARCH_USERNAME
          value: "elastic"
        - name: FLEET_SERVER_ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_PASSWORD
        - name: FLEET_SERVER_ELASTICSEARCH_CA
          value: "/etc/tls/ca.crt"
        - name: FLEET_SERVER_POLICY_ID
          value: "fleet-server-policy"
        - name: FLEET_SERVER_INSECURE_HTTP
          value: "true"
        - name: KIBANA_FLEET_HOST
          value: "http://kibana:5601"
        ports:
        - containerPort: 8220
          name: fleet
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: "250m"
            memory: 256Mi
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: wildcard-illuminati-tls
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-server
  namespace: default
  labels:
    app.kubernetes.io/name: fleet-server
    app.kubernetes.io/instance: fleet-dev
    app.kubernetes.io/component: management
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    proyect: observability
spec:
  type: ClusterIP
  ports:
  - port: 8220
    targetPort: 8220
    name: fleet
  selector:
    app.kubernetes.io/name: fleet-server
    app.kubernetes.io/instance: fleet-dev

---
# -------------------------------------------------------------------
# 4. INGRESSES (Exposición externa Traefik)
# -------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elastic-stack-ingress
  namespace: default
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
  labels:
    app.kubernetes.io/name: elastic-ingress
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    proyect: observability
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - elastic-dev.illuminati.dark
    - kibana-dev.illuminati.dark
    - fleet-dev.illuminati.dark
    secretName: wildcard-illuminati-tls
  rules:
  - host: elastic-dev.illuminati.dark
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: elasticsearch
            port:
              number: 9200
  - host: kibana-dev.illuminati.dark
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              number: 5601
  - host: fleet-dev.illuminati.dark
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fleet-server
            port:
              number: 8220
