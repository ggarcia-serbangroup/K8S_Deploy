---
# -------------------------------------------------------------------
# 1. ELASTICSEARCH (StatefulSet + Service)
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: il-observability
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch-dev
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    storage: nutanix
    project: observability
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      app.kubernetes.io/instance: elasticsearch-dev
      environment: developer
      storage: nutanix
      project: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/instance: elasticsearch-dev
        app.kubernetes.io/component: search-engine
        app.kubernetes.io/part-of: elastic-stack
        environment: developer
        storage: nutanix
        project: observability
    spec:
      initContainers:
      - name: fix-volume-permissions
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1000:0 /usr/share/elasticsearch/data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
        env:
        - name: discovery.type
          value: single-node
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: xpack.security.enabled
          value: "true"
        - name: xpack.security.http.ssl.enabled
          value: "true"
        - name: xpack.security.http.ssl.key
          value: "/usr/share/elasticsearch/config/certs/tls.key"
        - name: xpack.security.http.ssl.certificate
          value: "/usr/share/elasticsearch/config/certs/tls.crt"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_PASSWORD
        ports:
        - containerPort: 9200
          name: https
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "500m"
            memory: 1Gi
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        - name: tls-certs
          mountPath: /usr/share/elasticsearch/config/certs
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: wildcard-illuminati-tls
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-data
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: storage
        environment: developer
        storage: nutanix
        project: observability
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "nutanix-cluster-g5-volume"
      resources:
        requests:
          storage: 300Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: il-observability
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch-dev
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    project: observability
spec:
  type: ClusterIP
  ports:
  - port: 9200
    targetPort: 9200
    name: https
  selector:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch-dev

---
# -------------------------------------------------------------------
# 2. KIBANA (Deployment + Service)
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: il-observability
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-dev
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    project: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
      app.kubernetes.io/instance: kibana-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/instance: kibana-dev
        app.kubernetes.io/component: visualization
        app.kubernetes.io/part-of: elastic-stack
        environment: developer
        project: observability
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:9.4.4
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "https://elasticsearch:9200"
        - name: ELASTICSEARCH_USERNAME
          value: "kibana_system"
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: KIBANA_SYSTEM_PASSWORD
        - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
          value: "/usr/share/kibana/config/certs/ca.crt"
        - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
          value: "illuminati_observability_secret_key_32chars_min"
        - name: SERVER_NAME
          value: "kibana-dev.illuminati.dark"
        - name: SERVER_SSL_ENABLED
          value: "true"
        - name: SERVER_SSL_CERTIFICATE
          value: "/usr/share/kibana/config/certs/tls.crt"
        - name: SERVER_SSL_KEY
          value: "/usr/share/kibana/config/certs/tls.key"
        ports:
        - containerPort: 5601
          name: https
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "250m"
            memory: 512Mi
        volumeMounts:
        - name: tls-certs
          mountPath: /usr/share/kibana/config/certs
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: wildcard-illuminati-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: il-observability
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-dev
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    project: observability
spec:
  type: ClusterIP
  ports:
  - port: 5601
    targetPort: 5601
    name: https
  selector:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-dev

---
# -------------------------------------------------------------------
# 3. FLEET-SERVER (Deployment + Service)
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-server
  namespace: il-observability
  labels:
    app.kubernetes.io/name: fleet-server
    app.kubernetes.io/instance: fleet-dev
    app.kubernetes.io/component: management
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    project: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-server
      app.kubernetes.io/instance: fleet-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-server
        app.kubernetes.io/instance: fleet-dev
        app.kubernetes.io/component: management
        app.kubernetes.io/part-of: elastic-stack
        environment: developer
        project: observability
    spec:
      enableServiceLinks: false
      containers:
containers:
      - name: fleet-server
        image: docker.elastic.co/elastic-agent/elastic-agent:9.4.4
        env:
        - name: FLEET_SERVER_ENABLE
          value: "true"
        - name: FLEET_SERVER_PORT
          value: "8220"
        - name: FLEET_SERVER_HOST
          value: "0.0.0.0"
        # Elasticsearch
        - name: FLEET_SERVER_ELASTICSEARCH_HOST
          value: "https://elasticsearch:9200"
        - name: FLEET_SERVER_ELASTICSEARCH_USERNAME
          value: "elastic"
        - name: FLEET_SERVER_ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_PASSWORD
        - name: FLEET_SERVER_ELASTICSEARCH_INSECURE
          value: "true"
        # Kibana
        - name: KIBANA_FLEET_HOST
          value: "https://kibana:5601"
        - name: KIBANA_FLEET_USERNAME
          value: "elastic"
        - name: KIBANA_FLEET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_PASSWORD
        - name: KIBANA_FLEET_SETUP
          value: "true"
        - name: KIBANA_FLEET_INSECURE
          value: "true"
        # Servidor Fleet
        - name: FLEET_SERVER_INSECURE_HTTP
          value: "false"
        - name: FLEET_SERVER_CERT
          value: "/etc/tls/tls.crt"
        - name: FLEET_SERVER_KEY
          value: "/etc/tls/tls.key"
        ports:
        - containerPort: 8220
          name: fleet
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-server
  namespace: il-observability
  labels:
    app.kubernetes.io/name: fleet-server
    app.kubernetes.io/instance: fleet-dev
    app.kubernetes.io/component: management
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    project: observability
spec:
  type: ClusterIP
  ports:
  - port: 8220
    targetPort: 8220
    name: fleet
  selector:
    app.kubernetes.io/name: fleet-server
    app.kubernetes.io/instance: fleet-dev

---
# -------------------------------------------------------------------
# 4. INGRESS (Exposición externa Traefik End-to-End SSL)
# -------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elastic-stack-ingress
  namespace: il-observability
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
    traefik.ingress.kubernetes.io/service.serverstransport: "il-observability-insecure-transport@kubernetescrd"
  labels:
    app.kubernetes.io/name: elastic-ingress
    app.kubernetes.io/part-of: elastic-stack
    environment: developer
    project: observability
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - elastic-dev.illuminati.dark
    - kibana-dev.illuminati.dark
    - fleet-dev.illuminati.dark
    secretName: wildcard-illuminati-tls
  rules:
  - host: elastic-dev.illuminati.dark
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: elasticsearch
            port:
              name: https
  - host: kibana-dev.illuminati.dark
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              name: https
  - host: fleet-dev.illuminati.dark
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fleet-server
            port:
              name: fleet
---
# -------------------------------------------------------------------
# 5. SERVERSTRANSPORT (Omitir validación TLS interna en Traefik)
# -------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: insecure-transport
  namespace: il-observability
spec:
  insecureSkipVerify: true

