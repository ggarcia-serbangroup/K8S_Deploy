apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: il-observability
spec:
  version: 9.4.4
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "nutanix-cluster-g5-volume"
        resources:
          requests:
            storage: 300Gi
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: il-observability
spec:
  version: 9.4.4
  count: 1
  elasticsearchRef:
    name: elasticsearch
  config:
    xpack.fleet.agents.elasticsearch.hosts: ["https://elasticsearch-es-http.il-observability.svc:9200"]
    xpack.fleet.agents.fleet_server.hosts: ["https://fleet-server-agent-http.il-observability.svc:8220"]
    xpack.fleet.packages:
      - name: system
        version: latest
      - name: elastic_agent
        version: latest
      - name: fleet_server
        version: latest
    xpack.fleet.agentPolicies:
      - name: Fleet Server Policy
        id: eck-fleet-server
        is_default_fleet_server: true
        namespace: default
        monitoring_enabled:
          - logs
          - metrics
        unenroll_timeout: 900
        package_policies:
          - name: fleet_server-1
            id: fleet_server-1
            package:
              name: fleet_server
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: fleet-server
  namespace: il-observability
  labels:
    environment: developer
    project: observability
spec:
  version: 9.4.4
  mode: fleet
  fleetServerEnabled: true
  policyID: eck-fleet-server
  elasticsearchRefs:
    - name: elasticsearch
  kibanaRef:
    name: kibana
  http:
    tls:
      certificate:
        secretName: wildcard-illuminati-tls
  deployment:
    replicas: 1
    podTemplate:
      spec:
        containers:
          - name: agent
            resources:
              limits:
                cpu: "500m"
                memory: 512Mi
              requests:
                cpu: "250m"
                memory: 256Mi
