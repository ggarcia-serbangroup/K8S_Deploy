apiVersion: v1
kind: Namespace
metadata:
  name: n8n
  labels:
    environment: developer
    project: n8n

---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n
  labels:
    environment: developer
    project: n8n

type: Opaque
stringData:
  # Credenciales de PostgreSQL
  POSTGRES_USER: "n8n_user"
  POSTGRES_PASSWORD: "CambiarEstaPasswordSegura123!"
  POSTGRES_DB: "n8n"
  
  # Clave de cifrado interna de n8n (reemplazar con una cadena aleatoria robusta)
  # Generar key: openssl rand -hex 32
  N8N_ENCRYPTION_KEY: "super-secret-encryption-key-change-me"