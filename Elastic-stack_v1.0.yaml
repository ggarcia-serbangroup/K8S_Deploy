apiVersion: v1
kind: Namespace
metadata:
  name: elastic-stack
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-prod
  namespace: elastic-stack
spec:
  version: 9.4.3
  nodeSets:
  - name: master-data-nodes
    count: 1
    config:
      node.roles: ["master", "data", "ingest", "remote_cluster_client"]
      # Optimización para cargas de trabajo de observabilidad y retención de 90 días
      cluster.routing.allocation.same_shard.host: true
    podTemplate:
      metadata:
        labels:
          app: elasticsearch
      spec:
        # Forzar que los Pods se ejecuten en nodos físicos distintos (Alta Disponibilidad)
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - elasticsearch
              topologyKey: "kubernetes.io/hostname"
        # Init container obligatorio para ajustar los límites de memoria virtual de Linux
        initContainers:
        - name: sysctl
          securityContext:
            privileged: true
            runAsUser: 0
          command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']
        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 4Gi
              cpu: "1"
            limits:
              memory: 4Gi
              cpu: "2"
          env:
          - name: ES_JAVA_OPTS
            value: "-Xms4g -Xmx4g" # Heap size fijado exactamente al 50% de la RAM del contenedor
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        # Reemplazar por tu StorageClass SSD con 'volumeBindingMode: WaitForFirstConsumer'
        storageClassName: premium-ssd-wait
        resources:
          requests:
            storage: 230Gi
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana-prod
  namespace: elastic-stack
spec:
  version: 9.4.2
  count: 1
  elasticsearchRef:
    name: elasticsearch-prod
  podTemplate:
    spec:
      containers:
      - name: kibana
        resources:
          requests:
            memory: 2Gi
            cpu: "500m"
          limits:
            memory: 2Gi
            cpu: "1"
